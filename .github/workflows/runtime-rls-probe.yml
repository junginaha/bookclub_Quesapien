name: Runtime RLS Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-rls-probe.yml"
      - "src/app/api/internal/rls-probe-20260930/route.ts"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production runtime
        run: |
          set -euo pipefail
          urls=(
            "https://www.qsapiens.com/api/internal/rls-probe-20260930"
            "https://jilmunhaneun-saramdeul.vercel.app/api/internal/rls-probe-20260930"
          )

          ok=0
          for attempt in $(seq 1 72); do
            for url in "${urls[@]}"; do
              code=$(curl -L --silent --show-error \
                --output /tmp/rls-probe.json \
                --write-out '%{http_code}' \
                --max-time 20 \
                "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PROBE_URL=$url"
                echo "PROBE_RESPONSE"
                jq . /tmp/rls-probe.json
                ok=1
                break 2
              fi
            done
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "Runtime probe endpoint did not become available."
            exit 1
          fi

          jq -e '
            .projectRef == "pgstyeddzbjoijmmnuuw" and
            .configured.supabaseUrl == true and
            .configured.anonKey == true and
            .configured.serviceRole == true
          ' /tmp/rls-probe.json > /dev/null
