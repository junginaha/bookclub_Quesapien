name: Supabase Security RLS Remediation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/022_secure_giants_conversations.sql"
      - ".github/workflows/security-rls.yml"

permissions:
  contents: read

concurrency:
  group: production-supabase-security-rls
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: pgstyeddzbjoijmmnuuw

    steps:
      - uses: actions/checkout@v4

      - name: Validate production credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          fi

      - name: Apply giants_conversations RLS lockdown
        run: |
          jq -n --rawfile query supabase/migrations/022_secure_giants_conversations.sql \
            '{query: $query, read_only: false}' > /tmp/rls-apply.json

          status=$(curl --silent --show-error \
            --output /tmp/rls-apply-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/rls-apply.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")

          if [ "$status" != "201" ]; then
            echo "RLS migration API returned HTTP $status"
            jq -r '.message // .error // "Unknown migration error"' /tmp/rls-apply-response.json
            exit 1
          fi

          echo "Migration 022 applied."

      - name: Verify giants_conversations protection
        run: |
          cat > /tmp/target-query.sql <<'SQL'
          with t as (
            select c.oid, c.relrowsecurity
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname = 'giants_conversations'
              and c.relkind in ('r','p')
          )
          select
            exists(select 1 from t) as table_exists,
            coalesce((select bool_and(relrowsecurity) from t), true) as rls_enabled,
            coalesce((select bool_or(has_table_privilege('anon', oid, 'SELECT')) from t), false) as anon_select,
            coalesce((select bool_or(has_table_privilege('anon', oid, 'INSERT')) from t), false) as anon_insert,
            coalesce((select bool_or(has_table_privilege('anon', oid, 'UPDATE')) from t), false) as anon_update,
            coalesce((select bool_or(has_table_privilege('anon', oid, 'DELETE')) from t), false) as anon_delete,
            coalesce((select bool_or(has_table_privilege('authenticated', oid, 'SELECT')) from t), false) as authenticated_select,
            coalesce((select bool_or(has_table_privilege('authenticated', oid, 'INSERT')) from t), false) as authenticated_insert,
            coalesce((select bool_or(has_table_privilege('authenticated', oid, 'UPDATE')) from t), false) as authenticated_update,
            coalesce((select bool_or(has_table_privilege('authenticated', oid, 'DELETE')) from t), false) as authenticated_delete,
            coalesce((select bool_and(has_table_privilege('service_role', oid, 'SELECT')) from t), true) as service_select,
            coalesce((select bool_and(has_table_privilege('service_role', oid, 'INSERT')) from t), true) as service_insert,
            coalesce((select bool_and(has_table_privilege('service_role', oid, 'UPDATE')) from t), true) as service_update,
            coalesce((select bool_and(has_table_privilege('service_role', oid, 'DELETE')) from t), true) as service_delete
          from t
          limit 1;
          SQL

          jq -n --rawfile query /tmp/target-query.sql \
            '{query: $query, read_only: true}' > /tmp/target-verify.json

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/target-verify.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            > /tmp/target-verify-response.json

          echo "TARGET_VERIFY"
          jq . /tmp/target-verify-response.json

          jq -e '
            .[0] as $r |
            ($r.table_exists == false) or
            (
              $r.rls_enabled == true and
              $r.anon_select == false and
              $r.anon_insert == false and
              $r.anon_update == false and
              $r.anon_delete == false and
              $r.authenticated_select == false and
              $r.authenticated_insert == false and
              $r.authenticated_update == false and
              $r.authenticated_delete == false and
              $r.service_select == true and
              $r.service_insert == true and
              $r.service_update == true and
              $r.service_delete == true
            )
          ' /tmp/target-verify-response.json > /dev/null

      - name: Inventory remaining public tables without RLS
        run: |
          cat > /tmp/inventory-query.sql <<'SQL'
          select distinct
            c.relname as table_name,
            pg_get_userbyid(c.relowner) as owner_name,
            c.relrowsecurity as rls_enabled,
            coalesce(e.extname, '') as extension_name
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          left join pg_depend d
            on d.classid = 'pg_class'::regclass
           and d.objid = c.oid
           and d.deptype = 'e'
          left join pg_extension e on e.oid = d.refobjid
          where n.nspname = 'public'
            and c.relkind in ('r','p')
            and c.relrowsecurity = false
          order by c.relname;
          SQL

          jq -n --rawfile query /tmp/inventory-query.sql \
            '{query: $query, read_only: true}' > /tmp/inventory.json

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/inventory.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            > /tmp/inventory-response.json

          echo "RLS_DISABLED_PUBLIC_INVENTORY"
          jq . /tmp/inventory-response.json

      - name: Inspect extension schemas
        run: |
          jq -n '{
            query: "select e.extname, n.nspname as schema_name from pg_extension e join pg_namespace n on n.oid = e.extnamespace where e.extname in ('"'"'postgis'"'"','"'"'vector'"'"') order by e.extname",
            read_only: true
          }' > /tmp/extensions.json

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/extensions.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            > /tmp/extensions-response.json

          echo "EXTENSION_SCHEMAS"
          jq . /tmp/extensions-response.json
